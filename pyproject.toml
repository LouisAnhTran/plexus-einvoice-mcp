[project]
name = "einvoice-mcp"
version = "0.1.0"
description = "MCP server exposing InvoiceNow (Peppol) e-invoice registration as agent tools"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
